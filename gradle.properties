org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 compiles Kotlin itself. It rejects org.jetbrains.kotlin.android applied
# alongside it, and rejects it a second way under the new DSL that AGP 9 turns
# on by default, so that plugin is gone from both build scripts. The version
# AGP would use is its own 2.2.10; the root buildscript raises it to the 2.4.10
# this catalog pins.
android.builtInKotlin=true

# Stable since Gradle 8.1 and the default in a future major. Verified against
# this project's whole task set -- testDebugUnitTest, lintDebug and
# assembleRelease all store an entry with no problems reported -- so a plugin
# that cannot serialise its configuration now fails here rather than being
# discovered when Gradle stops offering the opt-out.
org.gradle.configuration-cache=true
