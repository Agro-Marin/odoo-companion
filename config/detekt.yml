build:
  maxIssues: 0

style:
  MagicNumber:
    active: false
  ReturnCount:
    max: 4
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3

complexity:
  LongMethod:
    threshold: 70
  TooManyFunctions:
    thresholdInClasses: 15
    thresholdInFiles: 20

exceptions:
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true
