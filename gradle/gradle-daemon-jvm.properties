# The JVM Gradle's daemon runs on: a JetBrains JDK 25, the one Android Studio
# bundles. The version alone let a build attach to any idle JDK-25 daemon --
# the VS Code Java extension's Eclipse Adoptium runtime among them, which has
# no jlink, so AGP's JdkImageTransform failed now and then. Measured with a
# scratch Gradle home: with the version alone the Adoptium daemon was reused;
# with the vendor too, "1 incompatible Daemon could not be reused" and a
# JetBrains one started. No download URLs: the ones Android Studio generated
# fetch Temurin, which this vendor refuses, and regenerating them needs a
# toolchain resolver plugin this build does not apply.
toolchainVendor=JETBRAINS
toolchainVersion=25
