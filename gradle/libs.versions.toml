[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
coreKtx = "1.19.1"
coreTelecom = "1.1.0"
appcompat = "1.8.0"
material = "1.14.0"
lifecycle = "2.11.0"
work = "2.12.0"
room = "2.8.5"
datastore = "1.3.0"
playServicesLocation = "21.4.0"
# On-device OCR and QR for classifying a document before it leaves the
# handset. The bundled flavour: the models ship inside the APK, about 18 MB per
# ABI (measured). The Play-services flavour fetches them through the Play Store,
# so a handset without the store never read a document, and nothing said so.
mlkitTextRecognition = "16.0.1"
mlkitBarcodeScanning = "17.3.0"
okhttp = "5.5.1"
serialization = "1.12.0"
coroutines = "1.11.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
# 4.17 reaches jdk.internal.access, which java.base does not export: without
# the --add-exports app/build.gradle.kts passes the test JVM, every Robolectric
# test fails before it runs ("Failed to interact with raw FileDescriptor
# internals"). It emulates API 37, which 4.16.1 refused.
robolectric = "4.17"
# The SIP stack of the softphone, GPLv3: the app is installed on company
# handsets only and never distributed outside the company. The no-video build:
# the softphone carries voice alone, and the full one tripled the APK every
# handset downloads over MDM.
linphone = "5.5.39"
# Wake-ups from Odoo through any UnifiedPush distributor (ntfy, or an FCM
# bridge), sealed with RFC 8291 Web Push encryption that the connector opens.
unifiedpush = "3.3.5"
# The Tink the connector 3.3.5 declares. The connector carries it as a runtime
# dependency only; OdooSealedWakeupTest compiles against its HybridDecrypt to
# open a wake-up sealed by Odoo, so the tests name it at the same version. Not
# the newest Tink (1.24.0): naming that here moves only the tests, which then
# check a library the app does not ship. It follows the connector.
tink = "1.23.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-telecom = { module = "androidx.core:core-telecom", version.ref = "coreTelecom" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcodeScanning" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
linphone = { module = "org.linphone.no-video:linphone-sdk-android", version.ref = "linphone" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush" }
tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
